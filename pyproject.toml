[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-vlm-image-labeler"
version = "0.1.0"
description = "A lightweight multi-model image labeling pipeline with consensus scoring."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.7.0",
  "pyyaml>=6.0.1",
  "pillow>=10.0.0",
  "tqdm>=4.66.0",
]

[project.optional-dependencies]
api = [
  "openai>=1.0.0",
]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.5.0",
]

[tool.setuptools]
packages = ["src", "src.model_clients", "src.validators"]
