version: "2.4"

services:
  vlm-ocr:
    build:
      context: .
      dockerfile: Dockerfile
    image: vlm-ocr:latest
    working_dir: /app
    runtime: nvidia
    tty: true
    stdin_open: true
    shm_size: "8gb"
    environment:
      HF_HOME: /root/.cache/huggingface
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    volumes:
      - ./data/flowchart_crops:/app/data/flowchart_crops
      - ./data/pdfs:/app/data/pdfs
      - ./data/page_images:/app/data/page_images
      - ./outputs:/app/outputs
      - ${HOME}/.cache/huggingface:/root/.cache/huggingface
    command: bash
